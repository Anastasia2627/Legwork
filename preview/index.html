function render(){const route=(location.hash.replace(/^#\/?/,'').split('/')[0]||'home');app.innerHTML=(pages[route]||pages.home)();document.title=(route==='home'?'ABOUT':route.toUpperCase())+' | SVITLANA YURCHAK';document.querySelectorAll('.main-nav a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#/'+(route==='home'?'':route)));document.querySelectorAll('[data-notice]').forEach(b=>b.onclick=()=>alert('Preview only — this action requires the full website.'));document.querySelectorAll('[data-package]').forEach(b=>b.onclick=()=>{chosen=b.dataset.package;render();document.getElementById('mentorform')?.scrollIntoView()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{b.parentElement.querySelectorAll('.pill').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});const search=document.getElementById('shopsearch');if(search)search.addEventListener('input',e=>{const text=e.target.value.toLowerCase();document.querySelectorAll('#shop-results .lesson').forEach(card=>card.style.display=card.textContent.toLowerCase().includes(text)?'':'none')});document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{b.parentElement.querySelectorAll('.pill').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('change',()=>{document.querySelectorAll('[data-category]').forEach(x=>x.classList.remove('selected'))}));}
window.addEventListener('hashchange',()=>{render();const anchor=location.hash.slice(2);if(anchor==='prices'||anchor==='free'||anchor==='mentorform')document.getElementById(anchor)?.scrollIntoView();else window.scrollTo(0,0)});render();
// Static-preview links to in-page sections, without changing the route.
document.addEventListener('click', e=>{const a=e.target.closest('a[href]');if(!a)return;const target=a.getAttribute('href');if(['#/prices','#/free','#/mentorform'].includes(target)){e.preventDefault();const id=target.slice(2);document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'});}});
