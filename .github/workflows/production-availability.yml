name: LEGWORK production availability (read-only)

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  availability:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public site and Durable Object database health
        run: node scripts/production-health.mjs https://legwork-school.vlasiuk-anastasiia15.workers.dev
