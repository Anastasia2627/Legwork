name: Legwork quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check browser JavaScript syntax
        run: node --check public/app.js
      - name: Run integration tests
        run: npm test
      - name: Verify Cloudflare migration generator
        run: npm run cloudflare:build
      - name: Check generated Worker source syntax
        run: |
          node --check cloudflare/generated/app.js
          node --check cloudflare/generated/mailing.js
          node --check cloudflare/generated/certificates.js
          node --check cloudflare/worker.js
          node --check cloudflare/image-upload.js
          node --check cloudflare/sqlite-adapter.js
      - name: Check Cloudflare bundle without deploying
        run: npm run cloudflare:check
      - name: Smoke-test private routes in local Cloudflare runtime
        run: npm run cloudflare:smoke
