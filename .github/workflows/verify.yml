name: Verify Legwork
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies (including native SQLite)
        run: npm install --no-audit --no-fund
      - run: node --check server.js
      - run: node --check lib/features.js
      - run: node --check lib/learning.js
      - run: node --check lib/bundles.js
      - run: node --check lib/payments.js
      - run: node --check lib/mailing.js
      - run: node --check lib/certificates.js
      - run: node --check lib/editorial.js
      - run: node --check public/editorial-admin.js
      - run: node --check public/certificates.js
      - run: node --check public/checkout.js
      - run: node --check public/app.js
      - run: node --check public/i18n.js
      - run: node --check public/es-public.js
      - run: node --check public/es-admin.js
      - run: node --check public/es-errors.js
      - run: node --check public/certificates.js
      - run: node --check public/learning.js
      - run: npm test
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser end-to-end tests
        run: npm run test:e2e
        env:
          CI: true
      - name: Save failing browser test traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: legwork-browser-errors
          path: test-results/
          retention-days: 5
