name: Publish Legwork website preview
on:
  push:
    branches: [main]
    paths:
      - 'preview/**'
      - 'public/styles.css'
      - 'public/learning.css'
      - 'public/accessibility.css'
      - '.github/workflows/pages-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static preview
        run: |
          mkdir -p dist
          cp preview/index.html dist/index.html
          cp preview/demo.js dist/demo.js
          cp preview/reference.js preview/reference.css dist/
          cp public/styles.css public/learning.css public/accessibility.css dist/
          touch dist/.nojekyll
          test -s dist/index.html
          test -s dist/demo.js
          test -s dist/reference.js
          test -s dist/reference.css
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
